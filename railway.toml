# Docker deploy — un servicio (SPA + API).
#
# Variables RUNTIME (obligatorias):
#   SUPABASE_URL=https://hguairmbmavkdckhjvji.supabase.co
#   SUPABASE_ANON_KEY=<anon public>          ← para el frontend vía /api/public-config
#   SUPABASE_SERVICE_ROLE_KEY=<service_role> ← solo API
#   ALLOWED_ORIGINS=https://tracker-pro-production.up.railway.app
#   NODE_ENV=production
#
# Opcionales en BUILD (Available at Build Time) — si faltan, la SPA
# obtiene la config en runtime de /api/public-config:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
#
# NO definas PORT.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/version"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
