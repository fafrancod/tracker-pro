# API service — monorepo root.
# Node 22: engines + .nvmrc + NIXPACKS_NODE_VERSION (nixpacks.toml).
# No uses nixPkgs = ["nodejs_22"] — el pin de nixpkgs de Railway no lo tiene.
#
# Si el build sigue fallando con EBUSY en node_modules/.cache:
#   Variables del servicio → quita cualquier volume montado en /app/node_modules

[build]
builder = "NIXPACKS"
# --include=dev: tsc/esbuild viven en devDependencies
# --cache /tmp/npm-cache: evita EBUSY al rmdir de node_modules/.cache en Railway
buildCommand = "npm ci --include=dev --cache /tmp/npm-cache --no-audit --no-fund && npm run build:api"

[deploy]
startCommand = "npm run start:api"
healthcheckPath = "/api/version"
restartPolicyType = "ON_FAILURE"

# Frontend (segundo servicio, misma raíz del monorepo):
#   buildCommand = "npm ci --include=dev --cache /tmp/npm-cache --no-audit --no-fund && npm run build:web"
#   startCommand = "npx serve packages/web/dist -s -l $PORT"
#   Variables de BUILD (VITE_*): VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_API_BASE_URL
