# Deploy con Dockerfile (más fiable que Nixpacks en monorepos).
# Railway lee este archivo y usa el Dockerfile de la raíz.
#
# NO definas PORT.
#
# Variables del servicio:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   → marcar como disponibles en build
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   ALLOWED_ORIGINS=https://tracker-pro-production.up.railway.app
#   NODE_ENV=production
#
# En Railway → Variables → para cada VITE_*:
#   "Available at Build Time" = ON (necesario para Docker ARG/ENV en build)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node packages/api/dist/server.cjs"
healthcheckPath = "/api/version"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
