# Un solo servicio: API Express + SPA React (packages/web/dist).
#
# En Railway (mismo servicio):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY  (build de la web)
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   ALLOWED_ORIGINS=https://tracker-pro-production.up.railway.app
#   NIXPACKS_NODE_VERSION=22
#   NPM_CONFIG_PRODUCTION=false
#
# Opcional: VITE_API_BASE_URL vacío o la misma URL pública (same-origin).

[build]
builder = "NIXPACKS"
buildCommand = "npm run build:prod"

[deploy]
startCommand = "npm run start:api"
healthcheckPath = "/api/version"
restartPolicyType = "ON_FAILURE"
