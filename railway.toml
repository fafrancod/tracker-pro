# API service — monorepo root.
#
# Importante:
# - Node 22 vía NIXPACKS_NODE_VERSION / engines / .nvmrc
# - El install lo hace nixpacks.toml (una sola vez).
# - buildCommand SOLO compila: un segundo npm ci provoca
#   EBUSY: rmdir '/app/node_modules/.cache' en Railway.
#
# Si sigue EBUSY: Settings del servicio → Volumes → elimina montajes
# sobre /app o node_modules, luego Clear build cache + redeploy.

[build]
builder = "NIXPACKS"
buildCommand = "npm run build:api"

[deploy]
startCommand = "npm run start:api"
healthcheckPath = "/api/version"
restartPolicyType = "ON_FAILURE"

# Frontend (segundo servicio, misma raíz):
#   En nixpacks.toml del repo el build es de API; para web, en el panel
#   del servicio Web sobrescribe Build Command a:
#     npm run build:web
#   y Start:
#     npx serve packages/web/dist -s -l $PORT
