# Build Android debug APK (always) and signed release AAB when keystore secrets exist.
name: Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - 'packages/core/**'
      - '.github/workflows/android.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build:
    name: Build APK / AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web + Capacitor sync
        env:
          # Absolute API URL required for native WebView (override via repo Variables)
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://example.invalid' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || '' }}
          VITE_APP_CHANNEL: ci
        run: npm run build:android

      - name: Assemble debug APK
        working-directory: packages/web/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-tracker-debug-apk
          path: packages/web/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode release keystore (optional)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 — skipping signed AAB"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > packages/web/android/ci-release.keystore
          {
            echo "storeFile=ci-release.keystore"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > packages/web/android/keystore.properties
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Bundle release AAB (signed)
        if: steps.keystore.outputs.present == 'true'
        working-directory: packages/web/android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload release AAB
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-tracker-release-aab
          path: packages/web/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
