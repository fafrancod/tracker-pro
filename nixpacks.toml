# Railway / Nixpacks — un servicio (API + SPA)

[variables]
NIXPACKS_NODE_VERSION = "22"
NPM_CONFIG_PRODUCTION = "false"
NPM_CONFIG_CACHE = "/tmp/npm-cache"

[phases.install]
cmds = [
  "mkdir -p /tmp/npm-cache",
  "if [ -d node_modules/.cache ]; then rm -rf node_modules/.cache 2>/dev/null || mv node_modules/.cache \"/tmp/nm-cache-$$\" 2>/dev/null || true; fi",
  "NPM_CONFIG_PRODUCTION=false npm install --include=dev --no-audit --no-fund --cache /tmp/npm-cache"
]

[phases.build]
# Web primero (dist), luego API (Express sirve packages/web/dist en runtime)
cmds = ["npm run build:prod"]
