# Preferir Dockerfile (railway.toml builder = DOCKERFILE).
# Este archivo queda solo como fallback si alguien fuerza Nixpacks.

[variables]
NIXPACKS_NODE_VERSION = "22"
NPM_CONFIG_PRODUCTION = "false"
NPM_CONFIG_CACHE = "/tmp/npm-cache"

[phases.install]
cmds = [
  "mkdir -p /tmp/npm-cache",
  "NPM_CONFIG_PRODUCTION=false npm ci --include=dev --no-audit --no-fund --cache /tmp/npm-cache"
]

[phases.build]
cmds = ["npm run build:prod"]

[start]
cmd = "node packages/api/dist/server.cjs"
