# No listar nodejs_22 en nixPkgs: el nixpkgs que pincha Railway
# (p.ej. 5148520…) no define ese atributo y el setup falla.
# La versión de Node la resuelve el provider de Node de Nixpacks vía:
#   - engines.node en package.json
#   - .nvmrc / .node-version
#   - NIXPACKS_NODE_VERSION (variable de servicio o aquí)

[variables]
NIXPACKS_NODE_VERSION = "22"
NPM_CONFIG_PRODUCTION = "false"
